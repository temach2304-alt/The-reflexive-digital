{% extends "base.html" %}

{% block title %}Регистрация - РЦП{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 3rem auto;">
    <h2 style="text-align: center; margin-bottom: 1.5rem; color: #667eea;">🧠 Регистрация</h2>
    
    <form method="POST">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" class="form-control" required minlength="6">
        </div>
        
        <div class="form-group">
            <label for="role">Тип аккаунта</label>
            <select id="role" name="role" class="form-control" required>
                <option value="user">Ученик</option>
                <option value="moderator">Модератор (Педагог)</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Зарегистрироваться</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem; color: #666;">
        Уже есть аккаунт? <a href="{{ url_for('auth.login') }}" style="color: #667eea;">Войти</a>
    </p>
</div>
{% endblock %}

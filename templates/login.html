{% extends "base.html" %}

{% block title %}Вход в систему - РЦП{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 3rem auto;">
    <h2 style="text-align: center; margin-bottom: 1.5rem; color: #667eea;">🧠 Вход в систему</h2>
    
    <form method="POST">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem; color: #666;">
        Нет аккаунта? <a href="{{ url_for('auth.register') }}" style="color: #667eea;">Зарегистрироваться</a>
    </p>
</div>
{% endblock %}
